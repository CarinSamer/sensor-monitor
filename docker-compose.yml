services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sensor
      POSTGRES_PASSWORD: sensor_dev_password
      POSTGRES_DB: sensors
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor -d sensors"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://sensor:sensor_dev_password@db:5432/sensors
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: