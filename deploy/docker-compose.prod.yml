services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sensor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sensors
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor -d sensors"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/carinsamer/sensor-monitor:latest
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      DATABASE_URL: postgresql://sensor:${POSTGRES_PASSWORD}@db:5432/sensors
      API_KEY: ${API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: